[includes]
base = "phase1_baseline.toml"

# ---- Energy tuning (kept as-is from your old file) ----
[energy]
high_energy_penalty = 2.0
medium_energy_penalty = 1.0
low_energy_reference = 0.0
neighbor_interaction_strength = 0.1
geometric_strain_penalty = 0.2  # Reduced for limited continuity

[monte_carlo]
temperature = 0.1
steps = 10000                 # for other scripts if you want
base_steps = 100              # used by MC init / scaling
neighborhood_radius = 3
verify_energy = false
convergence_threshold = 1e-6

# ---- Healing experiment I/O + knobs ----
[healing]
scenario = "base"
tiling_path = "data/processed/penrose_tiling_energy_initialized.json"
output_dir = "data/experiments/healing"
sweep_steps = 100         # step intervals to check healing progress
seed_radius = 10.0
num_defects = 15
defect_threshold = 1.5

# ---- Growth section (kept as-is from your old file) ----
[growth]
seed_location = [30.0, 30.0]
seed_radius = 5.0
growth_steps = 100
healing_check_interval = 5

# ---- Analysis section (kept as-is) ----
[analysis]
ensemble_size = 20
confidence_level = 0.95

# ---- Debug section (kept as-is) ----
[debug]
verbosity = 2           # 0=quiet, 1=normal, 2=verbose
progress_every = 10    # print MC progress every N steps
trace_every = 10       # verbosity=2: print step-level trace every N MC steps
use_sampling = true
sample_size = 100
sample_method = "uniform"

# ---- Validation section (kept as-is) ----
[validation]
use_sampling = false
