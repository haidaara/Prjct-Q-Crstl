[project]
name = "quasi-phason-growth-experiments"
phase = 2
output_dir = "data/growth_experiments"

[monte_carlo]
temperature = 1.5  # This will be overwritten
base_steps = 100
burn_in_steps = 50  # Increased for better equilibration

[energy]
high_energy_penalty = 2.0
medium_energy_penalty = 1.0
low_energy_reference = 0.0
neighbor_interaction_strength = 0.1
geometric_strain_penalty = 0.2

[growth]
seed_radius = 5.0
growth_steps = 5    # Reduced for faster temperature sweep
mc_steps_per_growth = 200  # Increased for better statistics

[obstacles]
active_type = "pores"
test_densities = [0.0]  # Only baseline for temperature sweep
placement_method = "multiple_scalable"

[metrics]
track_defects = true
track_energy = true
track_growth_rate = true
save_visualization = true
save_full_state = false
plot_format = "png"
plot_dpi = 200