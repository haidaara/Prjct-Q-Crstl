[project]
name = "control-growth-only"
output_dir = "data/control_experiments"

[monte_carlo]
temperature = 1.5  # Doesn't matter
base_steps = 100
burn_in_steps = 0

[energy]
high_energy_penalty = 1.5    # Reduced from 2.0
medium_energy_penalty = 0.5  # Reduced from 1.0  
low_energy_reference = 0.0
neighbor_interaction_strength = 0.05  # Reduced from 0.1
geometric_strain_penalty = 0.1        # Reduced from 0.2

[growth]
seed_radius = 5.0
growth_steps = 5
mc_steps_per_growth = 0  # NO MC STEPS - GROWTH ONLY

[obstacles]
active_type = "pores"
test_densities = [0.0]
placement_method = "multiple_scalable"

[metrics]
track_defects = true
track_energy = true
track_growth_rate = true
save_visualization = true
save_full_state = false
plot_format = "png"
plot_dpi = 200