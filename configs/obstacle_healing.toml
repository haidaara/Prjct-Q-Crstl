[run]
input = "data/obstacles/fixed_defects/fixed_defects_density_0.1.json"
output_dir = "data/experiments/obstacle_healing"
run_name = "run_009_3150_steps_baseline"

[notes]
note = " Obstacle healing with fixed defects, target 150 additional defects, 3150 annealing steps., testing if sytem keep stable when healing basline defects."
seed = 123

[logging]
mode = "debug"      # only: "normal" or "debug"
print_every = 50
trace_every = 50

[obstacles]
mode = "fixed_defects"       # "pores" or "fixed_defects"

[regions]
annulus_inner = 2.0
annulus_outer = 16.0
relative_to_obstacle_radius = true
active_buffer = 22.0
fixed_k = 2
fixed_active_k = 3


[defects]
threshold = 1.5
auto_threshold = true


[damage]
enabled = false
target_defects = 150      # interpreted as ADDITIONAL defects above baseline
temperature = 10.0
max_steps = 200
check_every = 10
print_every = 10

[anneal]

schedule = [
  # # {t = 10.0,  steps = 10, name = "T5.0"},
  # {T = 3.0,  steps = 10, name = "T5.0"},
  # {T = 2.5,  steps = 20, name = "T2.5"},
  # {T = 1.2,  steps = 100, name = "T1.2"},
  {T = 0.6,  steps = 900, name = "T0.6"},
  {T = 0.3,  steps = 950, name = "T0.3"},
  {T = 0.15, steps = 1100, name = "T0.15"},
  {T = 0.1,  steps = 1200, name = "T0.1"},
]    ## 4 temperatures, total 3150 steps 


# schedule = [
#   {T = 3.0,  steps = 100, name = "T3.0"},
#   {T = 2.5,  steps = 120, name = "T2.5"},
#   {T = 1.2,  steps = 150, name = "T1.2"},
#   {T = 0.6,  steps = 200, name = "T0.6"},
#   {T = 0.3,  steps = 200, name = "T0.3"},
#   {T = 0.15, steps = 200, name = "T0.15"},
#   {T = 0.1,  steps = 300, name = "T0.1"},
# ]    ## 7 temperatures, total 1260 steps 

metrics_every = 10
snapshot_every = 50
verify_every = 50
initial_T = 0.3
neighborhood_radius = 3
