[project]
name = "quasi-phason-phase2"
version = "1.0.0"
description = "Obstacle creation and phason healing studies"

[tiling]
method = "de_bruijn_pentagrid"
window_origin = [ 0.0, 0.0,]
window_size = [ 60.0, 60.0,]
offsets = [ 0.0625, 0.1875, 0.34375, 0.15625, 0.25,]
seed = 42


[visualization]
show_tile_ids = false
show_plots = false
save_plots = true
plot_dpi = 300
figsize = [ 12, 12,]

[exports]
format = "json"
include_adjacency = true
save_lattice_coords = true
tiling_json = "data/raw/penrose_tiling.json"
output_dir = "data/obstacles"

[research]
phase = 2
focus = "obstacle_creation_and_validation"

[monte_carlo]
temperature = 0.3
base_steps = 1000
burn_in_steps = 100
neighborhood_radius = 3
verify_energy = true
verify_frequency = 0.1

[obstacles]
types = ["pores", "fixed_defects"]
placement = "multiple_scalable"
density_sweep = [0.01, 0.05, 0.1, 0.2]
min_radius = 1.5
max_radius = 4.0
defect_cluster_size = 1
output_dir = "data/obstacles"

[growth]
seed_radius = 5.0
growth_steps = 50
mc_steps_per_growth = 100

[visualization.tile_colors]
THICK = "#e74c3c"
THIN = "#3498db"

[visualization.obstacle_colors]
pore = "#2c3e50"
fixed_defect = "#f39c12"
